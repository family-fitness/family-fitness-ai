name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 의존성
        run: pip install -e ".[dev]"

      # Makefile 을 그대로 부른다. 여기에 명령을 베껴 두면 두 벌이 갈라진다.
      - name: verify
        run: make verify
