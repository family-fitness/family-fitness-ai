name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 의존성
        run: pip install -e ".[dev]"

      - name: lint
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: 타입
        run: mypy src

      - name: 테스트
        run: pytest -q
