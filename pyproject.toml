[project]
name = "family-fitness-ai"
version = "0.1.0"
description = "우리가족 체력키움 — AI 파트"
requires-python = ">=3.11"
# 서비스를 띄우고 표를 만드는 데 필요한 것. 한 줄에 하나씩 둔다.
dependencies = [
  "anthropic>=1.0",        # 코치 편성·문구 (claude)
  "faiss-cpu>=1.13",       # 코퍼스 벡터 검색
  "fastapi>=0.115",
  "google-genai>=2.0",     # 코치 편성·문구 (gemini)
  "httpx>=0.27",           # 임베딩 서버 호출
  "numpy>=1.26",
  "openpyxl>=3.1",         # 인증 기준표(.xlsx) 읽기
  "pandas>=2.2",           # 원자료 → 또래 분포
  "pydantic-settings>=2.4",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.10", "pre-commit>=3.7"]
# 원자료를 새로 걷을 때만 쓴다. data/raw 에 이미 걷어 둔 것이 있어 서비스는 쓰지 않는다.
collect = ["ocrmac>=1.0; sys_platform == 'darwin'", "youtube-transcript-api>=1.2"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
# python_version 을 고정하지 않는다. 고정하면 mypy 가 의존성 스텁까지 그 문법으로
# 읽어, 새 파이썬용으로 설치된 numpy 스텁(PEP 695)에서 구문 오류가 난다.
# 지금은 각자의 인터프리터를 따라가고, 3.11 호환 검증은 CI 가 맡는다.
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
